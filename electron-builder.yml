appId: dev.local.bitacora
productName: OpenClod
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!{.claude,docs,scripts,src,tests,web}/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.editorconfig,.nvmrc,dev-app-update.yml,CHANGELOG.md,README.md,CLAUDE.md,CONTRIBUTING.md,CODE_OF_CONDUCT.md,SECURITY.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,*.tsbuildinfo}'
  # Fuentes y restos de compilación de los módulos nativos: en ejecución solo se usan los prebuilds.
  - '!**/node_modules/better-sqlite3/{build,deps,src}/**'
  - '!**/node_modules/node-pty/{deps,third_party,src}/**'
# Traducciones de Chromium (menú contextual, diálogos nativos): solo los idiomas de la interfaz.
electronLanguages:
  - es
  - en-US
asar: true
asarUnpack:
  - resources/**
  - '**/node_modules/better-sqlite3/**'
  # Módulo nativo de la terminal: binarios y conpty.dll fuera de app.asar.
  - '**/node_modules/node-pty/**'
  # El binario de Claude Code tiene que poder ejecutarse: no puede quedar dentro de app.asar.
  - '**/node_modules/@anthropic-ai/claude-agent-sdk*/**'
win:
  executableName: openclod
  target: nsis
  files:
    - '!**/node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*'
    - '!**/node_modules/node-pty/prebuilds/{darwin,linux}-*/**'
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  files:
    - '!**/node_modules/better-sqlite3/prebuilds/{win32,linux,linuxmusl}-*'
    - '!**/node_modules/node-pty/prebuilds/{win32,linux}-*/**'
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  category: Utility
  files:
    - '!**/node_modules/better-sqlite3/prebuilds/{win32,darwin}-*'
    - '!**/node_modules/node-pty/prebuilds/{win32,darwin}-*/**'
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Actualizaciones: el instalador, su .blockmap y latest.yml se suben a este servidor
# (npm run publicar) y la app los busca ahí.
publish:
  provider: generic
  url: https://openclod.joseariza.dev/
